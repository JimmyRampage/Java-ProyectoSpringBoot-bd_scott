<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- BootStrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Login</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header(title='Login')}"></div>

    <main class="m-auto">
      <div class="container">
        <div class="row">
          <form th:action="@{/login}" method="post" class="form-signin">
            <div class="row">
              <div class="col">
                <h4 class="h3 mb-3 font-weight-normal">Ingresar</h4>
                <div th:if="${param.error}">
                  <span class="text-danger"
                    >Usuario / Password incorrectos!</span
                  >
                </div>
                <div
                  th:if="${msg != null}"
                  class="alert alert-success"
                  th:text="${msg}"
                  role="alert"
                ></div>
                <label for="username" class="sr-only">Username</label>
                <input
                  type="text"
                  name="username"
                  id="username"
                  class="form-control"
                  placeholder="Username"
                  required
                  autofocus
                /><br />
                <label for="password" class="sr-only">Password</label>
                <input
                  type="password"
                  name="password"
                  id="password"
                  class="form-control"
                  placeholder="Password"
                  required
                /><br />
                <button class="btn btn-lg btn-primary btn-block" type="submit">
                  Entrar
                </button>
                <p class="text-primary" style="font-size: small">
                  ¿Todavía no estas registrado?
                  <a th:href="@{/signup}">Regístrate</a>
                </p>
              </div>
            </div>
          </form>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <!-- BootStrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
