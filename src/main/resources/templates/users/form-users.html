<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- BootStrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Inicio</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- HEADER -->
    <th:block th:with="tituloPagina=${editMode == 'true' ? 'Edit User' : 'Create new User'}">
      <div th:replace="~{fragments/header :: header(title=${tituloPagina})}"></div>
    </th:block>

    <main class="m-auto">
      <div class="conteiner">
        <div class="row">
          <div class="col">
            <div class="card shadow p-4">
              <h3 class="text-center mb-4">New Account</h3>

              <form
                th:action="${editMode == 'true'} ? @{/users/update} : @{/users/saveUser}"
                th:object="${user}"
                method="POST"
              >
                <!-- Errores -->
                <div
                  th:if="${#fields.hasErrors('*')}"
                  class="alert alert-danger"
                  role="alert"
                >
                  <strong>Por favor corrija los siguientes errores:</strong>
                  <ul>
                    <li
                      th:each="err : ${#fields.errors('*')}"
                      th:text="${err}"
                    ></li>
                  </ul>
                </div>

                <!-- Id -->
                <input type="hidden" th:field="*{id}" />

                <!-- Name -->
                <div class="mb-3">
                  <label class="form-label">Name</label>
                  <input
                    type="text"
                    min="3"
                    class="form-control"
                    th:field="*{name}"
                    th:errorclass="is-invalid"
                    th:validclass="is-valid"
                  />
                  <div
                    class="invalid-feedback"
                    th:if="${#fields.hasErrors('name')}"
                    th:errors="*{name}"
                  ></div>
                </div>

                <!-- Username -->
                <div class="mb-3">
                  <label class="form-label">Username</label>
                  <input
                    type="text"
                    class="form-control"
                    th:field="*{username}"
                    th:errorclass="is-invalid"
                    th:validclass="is-valid"
                  />
                  <div
                    class="invalid-feedback"
                    th:if="${#fields.hasErrors('username')}"
                    th:errors="*{username}"
                  ></div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    th:field="*{email}"
                    th:errorclass="is-invalid"
                    th:validclass="is-valid"
                  />
                  <div
                    class="invalid-feedback"
                    th:if="${#fields.hasErrors('email')}"
                    th:errors="*{email}"
                  ></div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    th:field="*{password}"
                    th:errorclass="is-invalid"
                    th:validclass="is-valid"
                  />
                  <div
                    class="invalid-feedback"
                    th:if="${#fields.hasErrors('password')}"
                    th:errors="*{password}"
                  ></div>
                </div>

                <!-- Enabled -->
                <div class="mb-3">
                  <label class="form-label">Enabled</label>
                  <input
                    type="checkbox"
                    class="form-check-label"
                    th:field="*{enabled}"
                    th:classappend="${#fields.hasErrors('enabled')} ? 'is-invalid' : ''"
                  />
                  <div
                    class="invalid-feedback"
                    th:if="${#fields.hasErrors('enabled')}"
                    th:errors="*{enabled}"
                  ></div>
                </div>

                <!-- Role -->

                <div class="mb-3">
                  <label class="form-label">Role</label>
                  <select
                    class="form-select"
                    aria-label="yyy"
                    th:field="*{roles}"
                    th:classappend="${#fields.hasErrors('roles')} ? 'is-invalid' : ''"
                  >
                    <option selected value="">Select Role</option>
                    <option
                      th:each="r : ${allRoles}"
                      th:value="${r.id}"
                      th:text="${r.nombre}"
                    ></option>
                  </select>
                  <div
                    class="invalid-feedback"
                    th:if="${#fields.hasErrors('roles')}"
                    th:errors="*{roles}"
                  ></div>
                </div>

                <!-- Registrarse -->
                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-primary"  th:text="${editMode == 'true' ? 'Update User' : 'Create User'}">
                    Registrarse
                  </button>
                </div>

                <div class="text-center mt-3">
                  <span
                    >¿Ya tienes cuenta?
                    <a th:href="@{/login}">Inicia Sesión</a></span
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <!-- BootStrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Script modal -->
    <script th:src="@{/assets/script/modal.js}"></script>
  </body>
</html>
