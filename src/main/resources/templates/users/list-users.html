<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Employees</title>
    <!-- BootStrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- FontAwesome -->
    <link
      href="https://use.fontawesome.com/releases/v7.1.0/css/all.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- HEADER -->
    <div
      th:replace="~{fragments/header :: header(title = 'Department List & Search')}"
    ></div>

    <!-- Button Create User -->
    <div class="container my-2">
      <div class="row">
        <div class="col text-center">
          <a th:href="@{/users/createUsers}" class="btn btn-primary"
            >Create New User</a
          >
        </div>
      </div>
    </div>

    <!-- Mensaje -->
    <div class="container mb-2">
      <div class="row">
        <h3
          th:if="${msg != null}"
          class="alert alert-success text-center"
          th:text="${msg}"
        ></h3>
      </div>
    </div>

    <!-- Buscador -->
    <div class="container">
      <div class="row my-2">
        <form
          th:action="@{/users/list}"
          method="GET"
          class="row g-3 align-items-center justify-content-center"
        >
          <div class="col-auto">
            <select name="type" class="form-select">
              <option
                value="name"
                th:selected="${tipoSeleccionado == 'name'}"
              >
                Name
              </option>
              <!-- A ver si Role funciona -->
              <option
                value="role"
                th:selected="${tipoSeleccionado == 'role'}"
              >
                Role
              </option>
            </select>
          </div>
          <div class="col-auto">
            <input
              type="text"
              name="value"
              class="form-control"
              placeholder="keyword..."
              th:value="${valorBuscado}"
            />
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-primary">Search</button>
            <a th:href="@{/users/list}" class="btn btn-secondary">Clean</a>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabla resultados -->
    <div class="container">
      <div class="row table-responsive">
        <table class="table table-striped">
          <thead>
            <tr class="table-primary">
              <th>NAME</th>
              <th>USERNAME</th>
              <th>EMAIL</th>
              <th>ENABLE</th>
              <th>ACTIONS</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="user : ${usersPage.content}">
              <td th:text="${user.name}"></td>
              <td th:text="${user.username}"></td>
              <td th:text="${user.email}"></td>
              <td th:text="${user.enabled ? 'Yes' : 'No'}"></td>
              <!-- ACTIONS -->
              <td>
                <!-- Update -->
                <a
                  th:href="@{/users/edit/{id} (id=${user.id})}"
                  class="text-warning"
                  ><i class="fa-regular fa-pen-to-square"></i
                ></a>
                <!-- Delete -->
                <a
                  href="#"
                  th:data-url="@{/users/delete/{id} (id=${user.id})}"
                  th:data-id-modal="'modalBorrarUser'"
                  onclick="event.preventDefault(); openModalGeneric(this, this.getAttribute('data-id-modal'))"
                  class="text-danger"
                >
                  <i class="fa-solid fa-ban"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Modal -->
    <div
      th:replace="~{fragments/modalDelete :: modal-confirmacion('modalBorrarUser', 'Delete?', '¿¿Are you sure you want to delete this user?') }"
    ></div>
    <!-- Pageable -->
    <div
      th:replace="~{fragments/pageable :: pageable(${usersPage}, '/users/list')}"
    ></div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- BootStrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
